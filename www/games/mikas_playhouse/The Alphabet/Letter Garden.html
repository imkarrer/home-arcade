<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letter Garden</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BB%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#eaf6e4;--card:#fff;--ink:#23402a;--mute:#5f7a64;--acc:#3f9d4f;--bad:#d9534f;--tile:#f6fbf3;--line:#cfe5c8;--soil:#8a5a3c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1d14;--card:#18291d;--ink:#e3f2dc;--mute:#92ad97;--acc:#58c36b;--bad:#ef6a66;--tile:#1f3425;--line:#2c4733;--soil:#6b4630}}
:root[data-theme="dark"]{--bg:#0f1d14;--card:#18291d;--ink:#e3f2dc;--mute:#92ad97;--acc:#58c36b;--bad:#ef6a66;--tile:#1f3425;--line:#2c4733;--soil:#6b4630}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:12px 16px;gap:10px}
header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:1.2rem;margin:0}
.icon{background:var(--card);border:1px solid var(--line);color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:1.3rem;cursor:pointer}
.gauge-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.gl{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mute);margin-bottom:6px}
.gl b{color:var(--ink);font-size:1rem}
.track{height:18px;background:var(--tile);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
#fill{height:100%;width:1%;background:linear-gradient(90deg,#e0b84a,var(--acc));border-radius:9px;transition:width .35s ease}
#fill.hurt{background:var(--bad)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
#flower{height:100%;max-height:300px;width:auto;max-width:100%}
.g{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
#stem{transform-origin:100px 240px;transition:transform .5s ease}
.prompt{display:flex;align-items:center;gap:10px;font-size:1rem;color:var(--mute)}
.target{font-family:inherit;cursor:pointer;background:var(--card);border:2px solid var(--acc);color:var(--ink);font-size:2.4rem;font-weight:800;min-width:64px;height:64px;display:grid;place-items:center;border-radius:16px}
#msg{height:1.2em;font-size:.85rem;color:var(--mute);text-align:center}
#grid{display:grid;gap:10px;padding-bottom:6px}
.tile{background:var(--tile);border:2px solid var(--line);color:var(--ink);font-size:2rem;font-weight:700;border-radius:16px;min-height:68px;cursor:pointer;font-family:inherit;touch-action:manipulation}
.tile:active{transform:scale(.96)}
.tile.wrong{background:var(--bad);border-color:var(--bad);color:#fff;opacity:.6;animation:sh .3s}
.tile.right{background:var(--acc);border-color:var(--acc);color:#fff}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.ov.on{display:flex}
.box{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;width:100%;max-width:380px;max-height:90%;overflow:auto;text-align:center}
.box h2{margin:0 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-align:left;font-size:.95rem}
.seg{display:flex;gap:4px}
.seg button{background:var(--tile);border:1px solid var(--line);color:var(--ink);min-width:40px;height:38px;border-radius:10px;font-size:.9rem;cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:12px}
.btn.alt{background:var(--tile);color:var(--ink);border:1px solid var(--line)}
.credit{margin:14px 0 0;font-size:.7rem;color:var(--mute);opacity:.7}.credit a{color:inherit;text-decoration:underline}
.sub{font-size:.75rem;color:var(--mute);margin:2px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🌻 Letter Garden</h1>
    <button class="icon" id="gear" aria-label="Settings">⚙️</button>
  </header>
  <div class="gauge-wrap">
    <div class="gl"><span>Garden growth</span><span><b id="gv">1</b> / 100</span></div>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="1" id="bar"><div id="fill"></div></div>
  </div>
  <div class="stage">
    <svg id="flower" viewBox="0 0 200 260" aria-hidden="true">
      <ellipse cx="100" cy="246" rx="70" ry="12" fill="var(--soil)"/>
      <rect id="stem" x="97" y="70" width="6" height="170" rx="3" fill="#3f9d4f"/>
      <g id="leafL" class="g"><ellipse cx="-22" cy="0" rx="24" ry="9" fill="#4fb35f" transform="rotate(-25)"/></g>
      <g id="leafR" class="g"><ellipse cx="22" cy="0" rx="24" ry="9" fill="#4fb35f" transform="rotate(25)"/></g>
      <g id="head" class="g"><g id="petals"></g><circle r="14" fill="#7a4a1e"/><circle r="8" fill="#a0652c"/></g>
    </svg>
  </div>
  <div class="prompt">Find <button class="target" id="target" aria-label="Hear the letter again">A</button> to grow the flower</div>
  <div id="msg"></div>
  <div id="grid"></div>
</div>

<div class="ov" id="settings"><div class="box">
  <h2>Settings</h2>
  <div class="row"><div>Wrong-pick penalty<p class="sub">Points lost per mistake</p></div><div class="seg" data-k="penalty"></div></div>
  <div class="row"><div>Correct-pick reward<p class="sub">Points gained per hit</p></div><div class="seg" data-k="gain"></div></div>
  <div class="row"><div>Choices per round</div><div class="seg" data-k="choices"></div></div>
  <div class="row"><div>Letter case</div><div class="seg" data-k="lcase"></div></div>
  <div class="row"><div>Speak letters<p class="sub">Name, or name + example word</p></div><div class="seg" data-k="speak"></div></div>
  <div class="row"><div>Sound effects</div><div class="seg" data-k="sound"></div></div>
  <button class="btn" id="close">Done</button>
  <button class="btn alt" id="restart">Restart game</button>
  <p class="credit">Made With ❤️ By <a href="https://ko-fi.com/kungpowunicorn" target="_blank" rel="noopener noreferrer">KungPowUnicorn</a></p>
</div></div>

<div class="ov" id="end"><div class="box">
  <h2 id="et"></h2><p id="ed"></p>
  <button class="btn" id="again">Play again</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
const OPTS={penalty:[1,5,10,20],gain:[1,2,5,10],choices:[4,6,9],lcase:['ABC','abc'],sound:['On','Off'],speak:['Off','Name','+Word']};
let S={penalty:1,gain:5,choices:6,lcase:'ABC',sound:'On',speak:'Name'};
try{Object.assign(S,JSON.parse(localStorage.getItem('lg_settings')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('lg_settings',JSON.stringify(S))}catch(e){}};
let g=1,target='',over=false,hits=0,miss=0,ctx;

function beep(f,d){if(S.sound!=='On')return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),v=ctx.createGain();o.frequency.value=f;v.gain.value=.08;o.connect(v);v.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
const NAMES={A:'ay',B:'bee',C:'see',D:'dee',E:'ee',F:'eff',G:'gee',H:'aitch',I:'eye',J:'jay',K:'kay',L:'ell',M:'em',N:'en',O:'oh',P:'pee',Q:'cue',R:'ar',S:'ess',T:'tee',U:'you',V:'vee',W:'double you',X:'ex',Y:'why',Z:'zee'};
const WORDS={A:'apple',B:'ball',C:'cat',D:'dog',E:'egg',F:'fish',G:'goat',H:'hat',I:'igloo',J:'jam',K:'kite',L:'lion',M:'moon',N:'nest',O:'octopus',P:'pig',Q:'queen',R:'rabbit',S:'sun',T:'tiger',U:'umbrella',V:'van',W:'whale',X:'x-ray',Y:'yo-yo',Z:'zebra'};
function say(c){if(S.speak==='Off'||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(NAMES[c]+(S.speak==='+Word'?', '+WORDS[c]:''));u.rate=.85;u.lang='en-US';speechSynthesis.speak(u)}catch(e){}}
const L=c=>S.lcase==='abc'?c.toLowerCase():c;

// flower
const petals=$('petals');
for(let i=0;i<12;i++){const e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');e.setAttribute('cx',0);e.setAttribute('cy',-28);e.setAttribute('rx',9);e.setAttribute('ry',22);e.setAttribute('transform','rotate('+i*30+')');petals.appendChild(e)}
function draw(){
  const p=Math.max(0,g)/100, sy=.3+.7*p, top=240-170*sy;
  $('stem').style.transform='scaleY('+sy+')';
  $('head').style.transform='translate('+100+'px,'+top+'px) scale('+(.35+.85*p)+')';
  const ly=240-60*sy-10, ls=.4+.7*p;
  $('leafL').style.transform='translate(100px,'+ly+'px) scale('+ls+')';
  $('leafR').style.transform='translate(100px,'+(ly-22*sy)+'px) scale('+ls+')';
  const n=Math.max(4,Math.round(4+8*p)), hue=Math.round(50-p*30+(p>.5?(p-.5)*340:0))%360;
  [...petals.children].forEach((e,i)=>{e.style.display=i<n?'':'none';e.setAttribute('transform','rotate('+(i*360/n)+')');e.setAttribute('fill','hsl('+(p<.34?48:p<.67?330:12)+',85%,'+(60+((i%2)*6))+'%)')});
  $('gv').textContent=Math.max(0,g);$('bar').setAttribute('aria-valuenow',g);
  $('fill').style.width=Math.max(0,g)+'%';
}

function round(){
  const prev=target,cols=S.choices===4?2:3;
  const pool='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  do{target=pool[Math.random()*26|0]}while(target===prev);
  const set=[target];
  while(set.length<S.choices){const c=pool[Math.random()*26|0];if(!set.includes(c))set.push(c)}
  set.sort(()=>Math.random()-.5);
  $('target').textContent=L(target);setTimeout(()=>{if(!over)say(target)},prev?700:300);
  const gr=$('grid');gr.style.gridTemplateColumns='repeat('+cols+',1fr)';gr.innerHTML='';
  set.forEach(c=>{const b=document.createElement('button');b.className='tile';b.textContent=L(c);b.onclick=()=>pick(b,c);gr.appendChild(b)});
}

function pick(b,c){
  if(over||b.classList.contains('wrong'))return;
  say(c);
  const f=$('fill');
  if(c===target){
    hits++;g=Math.min(100,g+S.gain);b.classList.add('right');beep(660,.12);
    $('msg').textContent='🌱 +'+S.gain+' — it grows!';draw();
    if(g>=100)return finish(true);
    setTimeout(round,260);
  }else{
    miss++;g-=S.penalty;b.classList.add('wrong');beep(180,.2);
    f.classList.add('hurt');setTimeout(()=>f.classList.remove('hurt'),300);
    $('msg').textContent='🥀 −'+S.penalty+' — wrong letter';draw();
    if(g<=0){g=0;draw();finish(false)}
  }
}

function finish(win){
  over=true;
  $('et').textContent=win?'🌻 Full bloom!':'🥀 The flower wilted';
  $('ed').textContent=(win?'You grew the garden to 100. ':'The gauge hit 0. ')+hits+' correct, '+miss+' misses.';
  setTimeout(()=>$('end').classList.add('on'),450);
  if(win)beep(880,.4);
}
function start(){g=1;hits=miss=0;over=false;target='';$('msg').textContent='';$('end').classList.remove('on');draw();round()}

// settings UI
function build(){
  document.querySelectorAll('.seg').forEach(s=>{
    const k=s.dataset.k;s.innerHTML='';
    OPTS[k].forEach(v=>{const b=document.createElement('button');b.textContent=v;b.className=S[k]===v?'on':'';
      b.onclick=()=>{S[k]=v;save();build();if(k==='choices'||k==='lcase')round()};s.appendChild(b)});
  });
}
$('target').onclick=()=>say(target);
$('gear').onclick=()=>{build();$('settings').classList.add('on')};
$('close').onclick=()=>$('settings').classList.remove('on');
$('settings').onclick=e=>{if(e.target.id==='settings')$('settings').classList.remove('on')};
$('restart').onclick=()=>{$('settings').classList.remove('on');start()};
$('again').onclick=start;
start();
</script>
</body>
</html>
