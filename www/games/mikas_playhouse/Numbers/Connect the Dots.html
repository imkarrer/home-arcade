<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect the Dots</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%84%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2433;--mute:#6b7280;--line:#d7dbe6;--acc:#6366f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c2030;--ink:#eef0f7;--mute:#9aa1b5;--line:#343a52;--acc:#818cf8}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c2030;--ink:#eef0f7;--mute:#9aa1b5;--line:#343a52;--acc:#818cf8}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}
header{width:100%;max-width:560px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
h1{font-size:1.15rem;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.icon{background:var(--card);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;font-size:1.3rem}
#hud{width:100%;max-width:560px;box-sizing:border-box;padding:0 14px}
.track{position:relative;height:26px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#fill{height:100%;width:1%;background:#ef4444;transition:width .3s,background .3s}
#num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
#status{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem;margin:6px 2px}
#board{flex:1;min-height:0;width:100%;max-width:560px;box-sizing:border-box;padding:4px 12px 12px;display:flex;align-items:center;justify-content:center}
svg{width:100%;height:100%;max-height:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;touch-action:manipulation}
.dot circle{fill:var(--card);stroke:var(--mute);stroke-width:.8;transition:fill .2s}
.dot text{font-size:4.6px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dot.done circle{stroke:none}.dot.done text{fill:#fff}
.dot.hint circle{stroke:var(--acc);stroke-width:1.6;animation:p .9s infinite alternate}
.dot.bad circle{fill:#ef4444}
@keyframes p{to{stroke-width:.5}}
#banner{position:absolute;pointer-events:none;font-size:1.6rem;font-weight:800;opacity:0;transition:opacity .3s}
#modal,#over{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;z-index:5}
.open{display:flex!important}
.panel{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:360px;max-height:90%;overflow:auto;box-sizing:border-box}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.seg{display:flex;gap:4px}.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-width:38px;height:36px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.big{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 18px;width:100%;margin-top:14px;font-weight:700}
.credit{text-align:center;font-size:.7rem;color:var(--mute);margin-top:14px;opacity:.7}.credit a{color:inherit}
small{color:var(--mute)}
</style>
</head>
<body>
<header><h1>🦄 Connect the Dots</h1><button class="icon" id="gear" aria-label="Settings">⚙️</button></header>
<div id="hud">
  <div class="track"><div id="fill"></div><div id="num">1 / 100</div></div>
  <div id="status"><span id="nxt"></span><span id="pic"></span></div>
</div>
<div id="board"><svg id="svg" viewBox="0 0 100 100"></svg></div>

<div id="over"><div class="panel" style="text-align:center"><div id="ot" style="font-size:2.2rem">🎉</div><h2 id="oh" style="margin:6px 0"></h2><p id="op" style="color:var(--mute)"></p><button class="big" id="again">Play again</button></div></div>

<div id="modal"><div class="panel">
  <h2 style="margin:0 0 6px">Settings</h2>
  <div class="row"><span>Sound effects</span><input type="checkbox" id="sSnd"></div>
  <div class="row"><span>Speak</span><div class="seg" id="sSpk"><button data-v="off">Off</button><button data-v="color">Colors</button><button data-v="num">Numbers</button></div></div>
  <div class="row"><span>Highlight next dot</span><input type="checkbox" id="sHint"></div>
  <div class="row"><span>Vibrate on miss</span><input type="checkbox" id="sVib"></div>
  <div class="row"><span>Theme</span><div class="seg" id="sTheme"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
  <div class="row" style="display:block"><div style="margin-bottom:8px">Points per correct dot <small>(wrong tap is always -1)</small></div><div class="seg" id="sPen"><button data-v="1">1</button><button data-v="5">5</button><button data-v="10">10</button><button data-v="20">20</button></div></div>
  <button class="big" id="newg">New game</button>
  <button class="big" id="close" style="background:var(--bg);color:var(--ink);border:1px solid var(--line)">Close</button>
  <div class="credit">Made With ❤️ By <a href="https://ko-fi.com/kungpowunicorn" target="_blank" rel="noopener">KungPowUnicorn</a></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const COLORS=[["Red","#ef4444"],["Orange","#f97316"],["Yellow","#eab308"],["Green","#22c55e"],["Teal","#14b8a6"],["Blue","#3b82f6"],["Purple","#8b5cf6"],["Pink","#ec4899"]];
const r1=a=>a.map(p=>[Math.round(p[0]*10)/10,Math.round(p[1]*10)/10]);
const star=r1(Array.from({length:10},(_,i)=>{const r=i%2?17:40,a=-Math.PI/2+i*Math.PI/5;return[50+r*Math.cos(a),54+r*Math.sin(a)]}));
const heart=r1(Array.from({length:18},(_,i)=>{const t=i*2*Math.PI/18;return[50+2.3*16*Math.pow(Math.sin(t),3),46-2.3*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]}));
const SHAPES=[
 {n:"Star",p:star},
 {n:"House",p:[[20,50],[50,20],[80,50],[72,50],[72,82],[56,82],[56,62],[44,62],[44,82],[28,82],[28,50]]},
 {n:"Heart",p:heart},
 {n:"Gem",p:[[30,20],[50,20],[70,20],[88,40],[69,64],[50,88],[31,64],[12,40]]}
];

const P=s=>s.trim().split(/\s+/).map(t=>t.split(",").map(Number));
const starN=(n,o,i,cy=50)=>r1(Array.from({length:2*n},(_,k)=>{const r=k%2?i:o,a=-Math.PI/2+k*Math.PI/n;return[50+r*Math.cos(a),cy+r*Math.sin(a)]}));
const poly=(n,k,cy=50,r=42,rot=-90)=>{const v=Array.from({length:n},(_,j)=>{const a=(rot+j*360/n)*Math.PI/180;return[50+r*Math.cos(a),cy+r*Math.sin(a)]}),o=[];v.forEach((p,j)=>{const q=v[(j+1)%n];for(let t=0;t<k;t++)o.push([p[0]+(q[0]-p[0])*t/k,p[1]+(q[1]-p[1])*t/k])});return r1(o)};
const rose=(n,b,a,m)=>r1(Array.from({length:m},(_,j)=>{const t=j*2*Math.PI/m,r=b+a*Math.cos(n*t);return[50+r*Math.cos(t-Math.PI/2),50+r*Math.sin(t-Math.PI/2)]}));
const EXTRA={
 Sparkle:starN(4,44,10),Sun:starN(8,42,28),Gear:starN(10,40,31),Burst:starN(12,42,30),
 Flower:rose(5,28,12,20),Clover:rose(4,30,12,20),Circle:rose(0,40,0,16),
 Triangle:poly(3,3,58),Square:poly(4,2,50,42,-45),Pentagon:poly(5,2,53),Hexagon:poly(6,2),Octagon:poly(8,1,50,42,-67.5),
 Moon:P("60,12 40,16 25,28 16,45 16,60 25,75 40,85 60,88 46,76 38,62 36,48 40,34 48,22"),
 Cloud:P("22,70 12,60 14,46 26,40 30,28 44,20 58,24 66,34 80,34 90,46 88,62 78,70"),
 Sailboat:P("52,10 78,54 56,54 56,62 84,62 72,86 28,86 16,62 44,62 44,24"),
 Fish:P("10,50 24,36 40,28 56,32 68,44 88,28 80,50 88,72 68,56 56,68 40,72 24,64"),
 Rocket:P("50,8 61,26 61,58 78,76 78,88 61,78 55,92 50,84 45,92 39,78 22,88 22,76 39,58 39,26"),
 Tree:P("50,8 66,30 58,30 76,54 62,54 84,76 56,76 56,90 44,90 44,76 16,76 38,54 24,54 42,30 34,30"),
 Cat:P("14,8 34,26 50,26 66,26 86,8 89,30 90,50 84,72 68,88 50,92 32,88 16,72 10,50 11,30"),
 Butterfly:P("50,32 66,12 86,14 92,36 78,52 90,70 76,88 58,78 50,64 42,78 24,88 10,70 22,52 8,36 14,14 34,12"),
 Crown:P("12,76 8,30 30,52 50,18 70,52 92,30 88,76 69,76 50,76 31,76"),
 Arrow:P("50,8 86,44 62,44 62,67 62,90 38,90 38,67 38,44 14,44"),
 Bolt:P("60,6 26,54 46,54 38,94 76,42 54,42 70,6"),
 Mushroom:P("10,52 14,34 26,20 42,13 58,13 74,20 86,34 90,52 64,52 64,78 60,90 40,90 36,78 36,52"),
 "Ice Cream":P("50,94 70,52 78,44 82,30 72,14 58,6 42,6 28,14 18,30 22,44 30,52"),
 Castle:P("8,88 8,22 18,22 18,32 28,32 28,22 36,22 36,52 64,52 64,22 72,22 72,32 82,32 82,22 92,22 92,88 56,88 56,68 44,68 44,88"),
 Balloon:P("50,6 70,12 84,28 86,46 76,62 60,68 56,80 56,94 44,94 44,80 40,68 24,62 14,46 16,28 30,12"),
 Car:P("6,66 6,54 22,48 32,32 50,28 68,32 78,48 94,54 94,66 86,66 82,78 70,78 66,66 34,66 30,78 18,78 14,66"),
 Hourglass:P("20,8 80,8 80,18 58,44 58,56 80,82 80,92 20,92 20,82 42,56 42,44 20,18"),
 Bell:P("50,8 62,16 68,34 72,56 88,76 60,76 50,90 40,76 12,76 28,56 32,34 38,16"),
 Kite:P("50,6 65,21 80,36 65,65 50,94 35,65 20,36 35,21"),
 Ghost:P("50,8 68,14 78,30 80,52 80,90 70,80 60,90 50,80 40,90 30,80 20,90 20,52 22,30 32,14"),
 Pizza:P("8,24 24,16 42,12 58,12 76,16 92,24 71,59 50,94 29,59")
};
Object.entries(EXTRA).forEach(([n,p])=>SHAPES.push({n,p}));
const shuffle=()=>{for(let i=SHAPES.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[SHAPES[i],SHAPES[j]]=[SHAPES[j],SHAPES[i]]}};shuffle();
let S={snd:true,spk:"color",hint:true,vib:true,theme:"auto",pts:5};
try{Object.assign(S,JSON.parse(localStorage.getItem("ctd")||"{}"))}catch(e){}
if(typeof S.spk==="boolean")S.spk=S.spk?"color":"off";const save=()=>{try{localStorage.setItem("ctd",JSON.stringify(S))}catch(e){}};
let score=1,si=0,nx=0,lock=false,over=false,ac;

function beep(f,d=.12,type="sine",v=.15){if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function say(t){if(S.spk==="off"||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}

function gauge(){const f=$("fill");f.style.width=Math.max(score,0)+"%";f.style.background=score<25?"#ef4444":score<60?"#f59e0b":"#22c55e";$("num").textContent=score+" / 100"}
function status(){const sh=SHAPES[si%SHAPES.length];$("pic").textContent="Picture "+(si+1);$("nxt").innerHTML=nx<sh.p.length?"Next: <b>"+(nx+1)+"</b> · "+COLORS[nx%8][0]:"Done!"}

function build(){
  const sh=SHAPES[si%SHAPES.length];nx=0;lock=false;
  let h='<polygon id="fillp" points="" fill="none"/><g id="lines" stroke-width="1.8" stroke-linecap="round"></g>';
  sh.p.forEach((p,i)=>{h+=`<g class="dot" data-i="${i}"><circle cx="${p[0]}" cy="${p[1]}" r="5.2"/><text x="${p[0]}" y="${p[1]}">${i+1}</text></g>`});
  $("svg").innerHTML=h;status();hint();
}
function hint(){document.querySelectorAll(".dot.hint").forEach(e=>e.classList.remove("hint"));if(!S.hint)return;const d=document.querySelector(`.dot[data-i="${nx}"]`);d&&d.classList.add("hint")}
function seg(a,b,c){const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",a[0]);l.setAttribute("y1",a[1]);l.setAttribute("x2",b[0]);l.setAttribute("y2",b[1]);l.setAttribute("stroke",c);$("lines").appendChild(l)}

$("svg").addEventListener("pointerdown",e=>{
  const d=e.target.closest(".dot");if(!d||lock||over)return;
  const i=+d.dataset.i,sh=SHAPES[si%SHAPES.length];
  if(d.classList.contains("done"))return;
  if(i!==nx){
    score--;gauge();beep(140,.25,"sawtooth",.12);
    d.classList.add("bad");setTimeout(()=>d.classList.remove("bad"),250);
    if(S.vib&&navigator.vibrate)try{navigator.vibrate(60)}catch(_){}
    if(score<=0){score=0;gauge();end(false)}
    return;
  }
  const [name,col]=COLORS[i%8];
  d.classList.add("done");d.classList.remove("hint");d.querySelector("circle").style.fill=col;
  if(i>0)seg(sh.p[i-1],sh.p[i],col);
  score=Math.min(100,score+S.pts);gauge();beep(330+i*35);say(S.spk==="num"?String(i+1):name);nx++;
  if(score>=100){if(nx===sh.p.length)closeShape(sh);end(true);return}
  if(nx===sh.p.length){closeShape(sh);done(sh)}else{status();hint()}
});
function closeShape(sh){seg(sh.p[sh.p.length-1],sh.p[0],COLORS[(sh.p.length-1)%8][1]);const f=$("fillp");f.setAttribute("points",sh.p.map(p=>p.join(",")).join(" "));f.setAttribute("fill",COLORS[si%8][1]);f.setAttribute("fill-opacity",".25")}
function done(sh){
  lock=true;status();
  [523,659,784].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*120));
  setTimeout(()=>say((/^[AEIOU]/.test(sh.n)?"An ":"A ")+sh.n+"!"),350);
  const t=document.createElementNS("http://www.w3.org/2000/svg","text");
  t.setAttribute("x",50);t.setAttribute("y",50);t.setAttribute("text-anchor","middle");t.setAttribute("font-size","9");t.setAttribute("font-weight","800");t.setAttribute("fill","currentColor");t.setAttribute("stroke","var(--card)");t.setAttribute("stroke-width","1.5");t.setAttribute("paint-order","stroke");t.textContent=sh.n+"!";$("svg").appendChild(t);
  setTimeout(()=>{if(over)return;if(score>=100){end(true);return}si++;build()},1900);
}
function end(win){
  over=true;lock=true;
  $("ot").textContent=win?"🎉":"💥";$("oh").textContent=win?"You win!":"Game over";
  $("op").textContent=win?"Gauge hit 100. "+(si+(nx?1:0))+" picture(s) touched.":"The gauge hit 0. Each wrong tap costs 1.";
  if(win)[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.25),k*130));else beep(90,.6,"sawtooth",.15);
  setTimeout(()=>$("over").classList.add("open"),win?500:300);
}
function newGame(){over=false;score=1;si=0;shuffle();$("over").classList.remove("open");$("modal").classList.remove("open");try{speechSynthesis.cancel()}catch(e){}gauge();build()}

function theme(){document.documentElement.removeAttribute("data-theme");if(S.theme!=="auto")document.documentElement.setAttribute("data-theme",S.theme)}
function sync(){
  $("sSnd").checked=S.snd;$("sHint").checked=S.hint;$("sVib").checked=S.vib;
  document.querySelectorAll("#sTheme button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.theme));
  document.querySelectorAll("#sSpk button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.spk));document.querySelectorAll("#sPen button").forEach(b=>b.classList.toggle("on",+b.dataset.v===S.pts));
  theme();save();
}
[["sSnd","snd"],["sHint","hint"],["sVib","vib"]].forEach(([id,k])=>$(id).onchange=e=>{S[k]=e.target.checked;sync();if(k==="hint")hint()});
document.querySelectorAll("#sTheme button").forEach(b=>b.onclick=()=>{S.theme=b.dataset.v;sync()});
document.querySelectorAll("#sPen button").forEach(b=>b.onclick=()=>{S.pts=+b.dataset.v;sync()});document.querySelectorAll("#sSpk button").forEach(b=>b.onclick=()=>{S.spk=b.dataset.v;sync();say(S.spk==="num"?"One":"Red")});
$("gear").onclick=()=>$("modal").classList.add("open");
$("close").onclick=()=>$("modal").classList.remove("open");
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").classList.remove("open")};
$("newg").onclick=newGame;$("again").onclick=newGame;
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("modal").classList.remove("open")});
sync();gauge();build();
</script>
</body>
</html>
