  "manifest": {
    "schema-version": "1.14.0",
    "install": {
      "freeciv": {
        "pkg-path": "freeciv",
        "pkg-group": "freeciv",
        "version": "3.2.2"
      },
      "git": {
        "pkg-path": "git"
      },
      "mindustry-server": {
        "pkg-path": "mindustry-server",
        "pkg-group": "mindustry",
        "version": "159.3"
      },
      "python312Full": {
        "pkg-path": "python312Full"
      }
    },
    "options": {
      "systems": [
        "x86_64-linux"
      ]
    },
    "services": {
      "freeciv": {
        "command": "  state=\"${ARCADE_STATE_DIR:-$FLOX_ENV_CACHE/arcade}\"\n  mkdir -p \"$state/freeciv\"\n  cd \"$state/freeciv\"\n  exec freeciv-server \\\n    --bind \"${ARCADE_LAN_ADDRESS:-127.0.0.1}\" \\\n    --port \"${ARCADE_FREECIV_PORT:-5556}\" \\\n    --saves \"$state/freeciv\" \\\n    --log \"$state/freeciv/server.log\"\n"
      },
      "mindustry": {
        "command": "  state=\"${ARCADE_STATE_DIR:-$FLOX_ENV_CACHE/arcade}\"\n  mkdir -p \"$state/mindustry\"\n  cd \"$state/mindustry\"\n  export JAVA_TOOL_OPTIONS=\"${JAVA_TOOL_OPTIONS:--Xms256M -Xmx1G}\"\n  printf '%s\\n' \\\n    \"config name Arcade\" \\\n    \"config port ${ARCADE_MINDUSTRY_PORT:-6567}\" \\\n    \"host ${ARCADE_MINDUSTRY_MAP:-Islands} ${ARCADE_MINDUSTRY_MODE:-sandbox}\" \\\n    | exec mindustry-server\n"
      }
    }
  },
