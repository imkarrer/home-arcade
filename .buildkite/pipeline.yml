# GitHub push/PR → this file. Queue=self on the ac-box agent.
# Source checks plus the tenant gate, both inside this tree's flox
# environment (docs/ci.md). Never recycle AC, never read /srv/arcade, and
# never bind a game port: the agent shares the box with the live
# arcade-freeciv and arcade-mindustry units.

agents:
  queue: self

flox_plugin: &flox
  s3-cache-bucket: flox-binary-cache
  s3-cache-endpoint: http://minio:9000
  s3-cache-region: us-east-1
  s3-cache-public-key: "flox-binary-cache-1:pSpP6x540XtBh+IMvmW8XrRHJDtIi+b31uvvIA0PyR0="
  s3-cache-push: true

steps:
  # Two gates in one step (scripts/ci_test.sh): the source checks this tree
  # has always run, and the tenant gate -- freeciv-server and
  # mindustry-server resolve from the environment the plugin activated and
  # each starts far enough to print its version. The environment IS the
  # tenant (homelab ADR 0009, step 2): the same manifest and lock become
  # what ac-box runs, so a package the lock lost, or a build that does not
  # start, goes red here and never becomes a generation. The plugin pushes
  # every output the lock names to MinIO, so the box's pull can substitute
  # rather than build (homelab docs/flox-findings.md section 1).
  - label: ":python: Source checks + tenant gate"
    key: test
    command: bash scripts/ci_test.sh
    plugins:
      - imkarrer/flox#main:
          <<: *flox
          command: bash scripts/ci_test.sh

  - wait: ~

  # NOT YET HERE, on purpose: `flox push` of the green environment to FloxHub
  # (imkarrer/arcade), which is the deploy edge ADR 0009 gives this tenant --
  # the box pulls a generation, not a sha. It needs a FloxHub token on the
  # agent (a sops secret the operator creates after `flox auth login`), and
  # it lands as its own step behind this wait, main only, once that exists.
  # Until then the tree reaches the box only as below.

  # This tree reaches ac-box only as a flake input of homelab, so a green
  # push here changes nothing on the box until homelab's flake.lock moves.
  # Trigger homelab's bump-lock step (scripts/hub-bump-lock.sh there) to
  # move it: it bumps the `home-arcade` input, runs homelab's gates on the
  # result, pushes, and homelab-deploy.timer switches at 03:30. Skips with a
  # message while HOMELAB_PUSH_TOKEN is unset on the agent. Part III row 24
  # in homelab/docs/architecture.md.
  - trigger: homelab
    label: ":arrow_up: bump homelab's lock"
    if: build.branch == "main"
    async: true
    # A trigger that cannot fire (slug renamed, permission missing) must not
    # redden THIS build -- queue-prod shares it, and a red build stalls the
    # tenant deploy. The bump simply does not happen, and hub-status shows
    # the lock behind its tip.
    soft_fail: true
    build:
      message: "home-arcade ${BUILDKITE_COMMIT} went green"
      env:
        HOMELAB_BUMP_INPUT: home-arcade
        HOMELAB_BUMP_REV: "${BUILDKITE_COMMIT}"
